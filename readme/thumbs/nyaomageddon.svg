<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs><clipPath id="c"><rect width="320" height="180" rx="14"/></clipPath></defs>
  <g clip-path="url(#c)">
  <defs>
    <radialGradient id="tg" cx="20%" cy="10%" r="120%"><stop offset="0" stop-color="hsl(154,70%,34%)"/><stop offset="1" stop-color="hsl(194,55%,17%)"/></radialGradient>
    <pattern id="ts" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="15" fill="hsl(154,60%,60%)" opacity=".12"/></pattern>
  </defs>
  <rect width="320" height="180" fill="url(#tg)"/><rect width="320" height="180" fill="url(#ts)"/>
  <text x="160" y="117.36" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif" font-size="76" font-weight="800"
    fill="hsl(154,80%,92%)" fill-opacity=".35">ニ</text>
  <rect width="320" height="180" fill="#08080e" opacity=".55"/>
  <g transform="translate(160 78)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="-17" y="-2" width="34" height="26" rx="5"/><path d="M-10 -2v-9a10 10 0 0 1 20 0v9"/></g>
  <text x="160" y="132" text-anchor="middle" font-family="'Space Grotesk',Verdana,sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#fff">PRIVATE</text>
  <!-- 文字の幅は閲覧者の端末のフォントで変わるので、箱は固定幅(ラベルはどれも 4 文字)にして文字を中央に置く。
       letter-spacing は最後の文字の後ろにも付くので、その半分だけ右にずらして見た目の中心を合わせる -->
  <rect x="12" y="12" width="60" height="22" rx="6" fill="#0a0a10" fill-opacity=".72"/>
  <text x="42.75" y="27.5" text-anchor="middle" font-family="'Space Grotesk',Verdana,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#ffcf5c">GAME</text>
  </g>
</svg>
