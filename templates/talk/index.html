<!doctype html>
<!--
  対話ページのテンプレート
  使い方:
    1. このファイルを talks/<slug>/index.html にコピーする
    2. タイトル・要旨・本文を書き換える(.turn.me = 自分、.turn.ai = AI、.aside = 後から付けた注釈)
    3. games.json に category: "talk", access: "hub", url: "talks/<slug>/" で登録する
    4. node scripts/check.mjs を実行する
  公開されるページです。個人情報・仕事の情報・秘密情報は除いてから置いてください。
  非公開にしたい議論はここに置かず、private リポジトリで管理して games.json には access: "private" で載せます。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>対話のタイトル — discoNeko works</title>
<meta name="description" content="この議論の要旨を一文で">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
:root {
  --bg: #0e0f17;
  --surface: #161824;
  --surface-2: #1d2030;
  --stroke: #2a2d40;
  --txt: #ecebf3;
  --muted: #9a9cb2;
  --me: #ffcf5c;
  --ai: #ff9ac1;
  --link: #7cc7ff;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-2: #f0ede6;
    --stroke: #e2ded3;
    --txt: #1d1c22;
    --muted: #6c6a75;
    --me: #b07800;
    --ai: #c43c78;
    --link: #1f7fc4;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
  line-height: 1.9;
  font-size: 16px;
}
a { color: var(--link); }
.wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }

.back {
  display: inline-block;
  font-family: "Space Grotesk", sans-serif;
  font-size: 0.85rem;
  color: var(--muted);
  text-decoration: none;
}
.back:hover { color: var(--txt); }

header { margin: 40px 0 32px; }
.kicker { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: 0.2em; font-size: 0.75rem; color: var(--ai); }
h1 {
  font-family: "Zen Old Mincho", serif;
  font-weight: 900;
  font-size: clamp(1.8rem, 6vw, 2.6rem);
  line-height: 1.35;
  margin: 8px 0 16px;
}
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 0.85rem; }

.summary {
  background: var(--surface);
  border: 1px solid var(--stroke);
  border-radius: 14px;
  padding: 18px 22px;
  margin: 0 0 40px;
}
.summary h2 { margin: 0 0 6px; font-size: 0.8rem; letter-spacing: 0.15em; color: var(--muted); font-family: "Space Grotesk", "Zen Kaku Gothic New", sans-serif; }
.summary p { margin: 0; }
.summary ul { margin: 6px 0 0; padding-left: 1.3em; }

section { margin: 48px 0; }
section > h2 {
  font-family: "Zen Old Mincho", serif;
  font-size: 1.35rem;
  line-height: 1.5;
  margin: 0 0 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--stroke);
}

/* 発言 */
.turn { position: relative; margin: 18px 0; padding-left: 16px; border-left: 3px solid var(--who); }
.turn.me { --who: var(--me); }
.turn.ai { --who: var(--ai); }
.turn .who {
  display: block;
  font-family: "Space Grotesk", sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--who);
}
.turn p { margin: 4px 0; }
.turn.ai { background: var(--surface); border-radius: 0 12px 12px 0; padding: 12px 18px 12px 16px; }

/* 後から付けた注釈 */
.aside {
  margin: 18px 0 18px 24px;
  font-size: 0.9rem;
  color: var(--muted);
}
.aside::before { content: "※ "; }

/* 刺さった一文 */
.quote {
  margin: 32px 0;
  font-family: "Zen Old Mincho", serif;
  font-weight: 700;
  font-size: 1.25rem;
  line-height: 1.7;
  text-align: center;
}

.ellipsis { text-align: center; color: var(--muted); letter-spacing: 0.5em; margin: 24px 0; }

footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--stroke); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; }
</style>
<!-- 共通ヘッダー(talks/talkbar.css / talkbar.js)。talks/<slug>/ に置いた時の相対パス -->
<link rel="stylesheet" href="../talkbar.css">
</head>
<body>
<div class="talkbar">
  <a class="talkbar-back" href="../../">← discoNeko works</a>
  <!-- 図解版(visual.html)を作ったら、読み物版・図解版の両方に切り替えを入れる:
  <span class="vs" role="group" aria-label="表示の切り替え"><a aria-current="page">読み物版</a><a href="visual.html">図解版</a></span> -->
  <div class="talkbar-progress" aria-hidden="true"></div>
</div>
<div class="wrap">

  <header>
    <div class="kicker">TALK</div>
    <h1>対話のタイトル</h1>
    <div class="meta">
      <span>2026-11-08</span>
      <span>相手: AI アシスタント</span>
      <span>#タグ</span>
    </div>
  </header>

  <aside class="summary">
    <h2>要旨</h2>
    <p>どんな問いから始まって、どこに着地したかを 2〜3 行で。</p>
    <ul>
      <li>面白かったポイント 1</li>
      <li>面白かったポイント 2</li>
    </ul>
  </aside>

  <section>
    <h2>論点 1: 最初の問い</h2>

    <div class="turn me">
      <span class="who">ME</span>
      <p>自分の発言。長いログは要所だけ抜き出して構いません。</p>
    </div>

    <div class="turn ai">
      <span class="who">AI</span>
      <p>AI の発言。</p>
    </div>

    <p class="aside">後から読み返して付けた注釈やツッコミ。</p>

    <p class="ellipsis">…</p>

    <p class="quote">この議論でいちばん刺さった一文</p>
  </section>

  <section>
    <h2>論点 2: 話が転がった先</h2>

    <div class="turn me">
      <span class="who">ME</span>
      <p>…</p>
    </div>

    <div class="turn ai">
      <span class="who">AI</span>
      <p>…</p>
    </div>
  </section>

  <footer>
    <a class="back" href="../../">← 一覧に戻る</a>
    <span>この対話は読みやすさのために抜粋・編集しています。</span>
  </footer>
</div>
<script src="../talkbar.js"></script>
</body>
</html>
